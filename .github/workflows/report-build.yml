name: ACM report

# Compiles the ACM (acmart) LaTeX report in Report/ to PDF.
# - Pull requests: compile check + PDF artifact.
# - Pushes to main: also refresh the rolling "report-latest" GitHub release.
# - Every run: rubric compliance check (Scripts/reporting/check_rubric.py) in the job summary,
#   and as a sticky comment on pull requests. Advisory only; it does not fail the build.

on:
  push:
    branches: [main]
    paths:
      - 'Report/**'
      - '.github/report-review/RUBRIC.md'
      - 'Scripts/reporting/check_rubric.py'
      - '.github/workflows/report-build.yml'
  pull_request:
    paths:
      - 'Report/**'
      - '.github/report-review/RUBRIC.md'
      - 'Scripts/reporting/check_rubric.py'
      - '.github/workflows/report-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: report-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ACM report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile with latexmk (TeX Live, acmart)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Report
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Report LaTeX warnings
        if: always()
        working-directory: Report
        run: |
          [ -f main.log ] || exit 0
          undef_refs=$(grep -c "Reference .* undefined" main.log || true)
          undef_cites=$(grep -c "Citation .* undefined" main.log || true)
          overfull=$(grep -c "^Overfull" main.log || true)
          pages=$(grep -oE "Output written on main.pdf \(([0-9]+) pages" main.log | grep -oE "[0-9]+ pages" || echo "unknown")
          {
            echo "### ACM report build"
            echo "| Check | Count |"
            echo "|---|---|"
            echo "| Pages | ${pages} |"
            echo "| Undefined references | ${undef_refs} |"
            echo "| Undefined citations | ${undef_cites} |"
            echo "| Overfull boxes | ${overfull} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$undef_refs" = 0 ] || echo "::warning file=Report/main.tex::${undef_refs} undefined references"
          [ "$undef_cites" = 0 ] || echo "::warning file=Report/main.tex::${undef_cites} undefined citations"

      - name: Rubric compliance check
        if: always()
        run: |
          python3 -I Scripts/reporting/check_rubric.py --tex Report/main.tex --out "$RUNNER_TEMP/rubric.md"
          cat "$RUNNER_TEMP/rubric.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post rubric results on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- report-rubric-check -->'
          { echo "$marker"; cat "$RUNNER_TEMP/rubric.md"; echo; echo "_Updated for ${GITHUB_SHA::7}. Advisory: this does not block merging._"; } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: AirBorder-Report
          path: Report/main.pdf
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Report/main.pdf AirBorder-Report.pdf
          notes="Automatically compiled from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%MZ)."
          if gh release view report-latest >/dev/null 2>&1; then
            gh release upload report-latest AirBorder-Report.pdf --clobber
            gh release edit report-latest --notes "$notes"
          else
            gh release create report-latest AirBorder-Report.pdf \
              --title "AirBorder report (latest build)" --notes "$notes" \
              --target "$GITHUB_SHA" --prerelease
          fi
