name: Report PR review (Claude)

# Claude reviews every pull request that touches the report, the rubric or the rubric checker.
# It grades the change against .github/report-review/RUBRIC.md, flags rubric regressions
# against the base branch, and flags report claims that contradict the repository.
# Findings are inline review comments, and branch protection requires conversation
# resolution, so an unresolved finding blocks the merge until someone resolves it.
#
# Claude is the primary reviewer, which keeps rubric review off Codex. If the Claude run
# fails (missing ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN, outage, rate limit), the
# workflow falls back to asking Codex for a review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Report/**'
      - '.github/report-review/**'
      - 'Scripts/reporting/check_rubric.py'

permissions:
  contents: read

concurrency:
  group: report-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude report review
    # Secrets are unavailable to fork PRs; skip drafts and automated report-sync PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'report-sync/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory job: its findings block through unresolved threads, not through a failed check.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rubric check with regressions vs base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .report-review/base
          git show "$BASE_SHA:Report/main.tex" > .report-review/base/main.tex 2>/dev/null || rm -f .report-review/base/main.tex
          python3 -I Scripts/reporting/check_rubric.py --tex Report/main.tex \
            --baseline-tex .report-review/base/main.tex --out .report-review/rubric-pr.md || true

      - name: Review with Claude
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request's changes to the AirBorder ACM report. Do not edit files.

            1. Read .github/report-review/RUBRIC.md and the deterministic check in
               .report-review/rubric-pr.md, which covers this PR vs its base branch, including regressions.
               It only matches keywords, so confirm each item by reading Report/main.tex.
            2. Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            3. Flag, as inline comments on the changed lines (one finding per comment, most severe first):
               - Rubric failures or regressions this PR introduces or leaves in edited sections: a missing
                 required section or element, a missing null hypothesis, a missing within/between-subjects
                 statement, equipment, location or time, a missing % complete estimate, a body over 10
                 pages, or study results presented in a plan.
               - Report claims (features, test counts, results, architecture) contradicted by the repository.
               - Grammar, spelling or clarity problems in changed text. Mark these as minor.
               Never ask for invented content. If a fix needs facts only the authors have, say so.
            4. Post one short summary with `gh pr comment`: the rubric grade per criterion
               (meets / needs improvement / unacceptable) and the count of findings. If there is nothing
               to flag, say the report change looks rubric-compliant.
          claude_args: >-
            --model ${{ vars.REPORT_REVIEW_CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: Fall back to Codex
        if: steps.claude.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "::warning::Claude report review failed; requesting a Codex review instead."
          gh pr comment "$PR" --body "@codex review

          The Claude report review could not run, so this is the fallback. Review the \`Report/\` changes against \`.github/report-review/RUBRIC.md\`. Flag rubric failures, rubric regressions vs the base branch, and report claims that contradict the repository, as inline comments. Do not ask for invented content."
