name: HCI quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/report-change-scope.yml

  engine:
    name: HCI engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Scripts/tests/forward-pr-feedback.test.cjs
      - run: node --test Web/journey-engine.test.cjs
      - run: python3 Scripts/select-ci-simulator.py --self-test
  backend:
    name: HCI backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
        working-directory: Backend
      - run: npm run check && npm test
        working-directory: Backend
      - run: node --test Web/backend/test/*.test.mjs
  browser:
    name: HCI browser
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.report_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Web/package-lock.json
      - run: npm ci
        working-directory: Backend
      - run: npm ci
        working-directory: Web
      - run: npx playwright install --with-deps chromium
        working-directory: Web
      - run: npm run test:ui
        working-directory: Web
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            Web/test-results/
            Web/playwright-report/
          if-no-files-found: warn
  required:
    name: HCI required tests
    if: always()
    needs: [scope, engine, backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require applicable suites to succeed
        env:
          ENGINE_RESULT: ${{ needs.engine.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          REPORT_ONLY: ${{ needs.scope.outputs.report_only }}
        run: |
          test "$ENGINE_RESULT" = success
          test "$BACKEND_RESULT" = success
          if [[ "$SCOPE_RESULT" == success && "$REPORT_ONLY" == true ]]; then
            test "$BROWSER_RESULT" = skipped || test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = success
          fi
